name: Publish npm Package

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Node
        run: node --version

      - name: Configure Nexus authentication
        shell: powershell
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          npm config set registry "http://10.100.102.25:8081/repository/npm-hosted/"
          npm config set //10.100.102.25:8081/repository/npm-hosted/:_auth "$( [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("${env:NEXUS_USERNAME}:${env:NEXUS_PASSWORD}")) )"
          npm config set //10.100.102.25:8081/repository/npm-hosted/:email "ci@mylab.local"
          npm config set //10.100.102.25:8081/repository/npm-hosted/:always-auth true

      - name: Publish package
        run: npm publish